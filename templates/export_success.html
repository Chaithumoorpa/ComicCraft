<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export Complete</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<main class="container center">
  <section class="card">
    <p class="eyebrow">EXPORT COMPLETE</p>
    <h1>Your comic is ready 🎉</h1>
    {% if pdf_path %}
      <a class="button-link" href="{{ pdf_path }}" download>Download PDF</a>
    {% endif %}
    <a class="button-link secondary" href="/">Go Create Another Comic</a>
  </section>
</main>
</body>
</html>
